x-runtime-security: &runtime-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    <<: *runtime-security
    ports:
      - "${HOST_PORT:-7860}:7860"
    environment: &app-environment
      FLASK_ENV: production
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
      HOST: 0.0.0.0
      PORT: 7860
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
      MODEL_DEVICE: ${MODEL_DEVICE:-cpu}
      MODEL_SHA256: ${MODEL_SHA256:-f9d35a9adccf8756db869ae7dba94c04d7025470efbd6a2550a232bca8b8c030}
      REDIS_URL: redis://redis:6379/0
      REQUIRE_REDIS: "1"
      REQUIRE_MODEL: "1"
      REQUIRE_DRUG_DATA: "1"
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-1}
      ACTION_LOGGING_ENABLED: "0"
      GNINA_ENABLED: ${GNINA_ENABLED:-0}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-0}
      OLLAMA_API_URL: ${OLLAMA_API_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      EMBEDDED_MODE: "0"
      FRAME_ANCESTORS: "'none'"
      MOLECULE_SIZE_LIMIT: ${MOLECULE_SIZE_LIMIT:-200}
      SMILES_LENGTH_LIMIT: ${SMILES_LENGTH_LIMIT:-2000}
      KINETICSKETCH_DATA_DIR: /var/lib/cascade/data
      KINETICSKETCH_STATE_DIR: /var/lib/cascade/state
      KINETICSKETCH_JOBS_DIR: /var/lib/cascade/jobs
      KINETICSKETCH_CACHE_DIR: /var/cache/cascade
      DRUG_DATABASE_PATH: /var/lib/cascade/data/drug_database.sqlite
      DRUG_FINGERPRINT_PATH: /var/lib/cascade/data/drug_fingerprints.npz
      MODEL_WEIGHTS_PATH: /var/lib/cascade/models/mdrepo_predictor.pt
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes: &app-volumes
      - type: bind
        source: ${CASCADE_DATA_HOST_PATH:-./data}
        target: /var/lib/cascade/data
      - type: bind
        source: ${CASCADE_MODELS_HOST_PATH:-./app/models}
        target: /var/lib/cascade/models
        read_only: true
      - state-data:/var/lib/cascade/state
      - jobs-data:/var/lib/cascade/jobs
      - cache-data:/var/cache/cascade
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7860/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - cascade-net

  redis:
    image: redis:7.4-alpine
    user: redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    <<: *runtime-security
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - cascade-net

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    <<: *runtime-security
    command: ["celery", "-A", "app.tasks.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=1"]
    depends_on:
      redis:
        condition: service_healthy
    environment: *app-environment
    restart: unless-stopped
    volumes: *app-volumes
    networks:
      - cascade-net

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    <<: *runtime-security
    command: ["celery", "-A", "app.tasks.celery_app:celery_app", "beat", "--loglevel=info", "--schedule", "/var/lib/cascade/state/celerybeat-schedule"]
    depends_on:
      redis:
        condition: service_healthy
    environment: *app-environment
    restart: unless-stopped
    volumes: *app-volumes
    networks:
      - cascade-net

networks:
  cascade-net:
    driver: bridge

volumes:
  state-data:
  jobs-data:
  cache-data:
  redis-data:
