version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kinetic-sketch-app
    ports:
      - "7860:7860"
    environment:
      - FLASK_ENV=production
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:?FLASK_SECRET_KEY environment variable must be set}
      - MODEL_DEVICE=${MODEL_DEVICE:-cpu}
      - HOST=0.0.0.0
      - PORT=7860
      - PYMOL_SERVER_HOST=pymol
      - PYMOL_SERVER_PORT=9123
      - PYMOL_ENABLED=0
      - OLLAMA_API_URL=http://ollama:11434
      - OLLAMA_ENABLED=0
      - MOLECULE_SIZE_LIMIT=200
      - SMILES_LENGTH_LIMIT=2000
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - REDIS_URL=redis://redis:6379/0
    networks:
      - kinetic-sketch
    restart: unless-stopped
    volumes:
      - /tmp/kinetic_sketch_logs:/tmp
      - jobs-data:/app/jobs
      - sqlite-db:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: kinetic-sketch-redis
    networks:
      - kinetic-sketch
    restart: unless-stopped

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kinetic-sketch-celery
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0
      - FLASK_ENV=production
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:?FLASK_SECRET_KEY environment variable must be set}
      - MODEL_DEVICE=${MODEL_DEVICE:-cpu}
    networks:
      - kinetic-sketch
    restart: unless-stopped
    volumes:
      - jobs-data:/app/jobs
      - sqlite-db:/app/data

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kinetic-sketch-beat
    command: celery -A app.tasks.celery_app beat --loglevel=info
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0
      - FLASK_ENV=production
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:?FLASK_SECRET_KEY environment variable must be set}
    networks:
      - kinetic-sketch
    restart: unless-stopped
    volumes:
      - jobs-data:/app/jobs
      - sqlite-db:/app/data

  pymol:
    image: pymol/pymol:latest
    container_name: kinetic-sketch-pymol
    environment:
      - PYMOL_SERVER_PORT=9123
    networks:
      - kinetic-sketch
    restart: unless-stopped
    profiles:
      - visualizer

  ollama:
    image: ollama/ollama:latest
    container_name: kinetic-sketch-ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_MODEL=mistral
    networks:
      - kinetic-sketch
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    profiles:
      - llm

  prometheus:
    image: prom/prometheus:latest
    container_name: kinetic-sketch-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - kinetic-sketch
    restart: unless-stopped
    profiles:
      - monitoring

networks:
  kinetic-sketch:
    driver: bridge

volumes:
  ollama-data:
  prometheus-data:
  jobs-data:
  sqlite-db:
