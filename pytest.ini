[pytest]
# PyTest Configuration for KineticSketch AI

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum Python version
minversion = 7.0

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --cov=.
    --cov-report=html
    --cov-report=term-missing

# Markers for test categorization
markers =
    unit: Unit tests for individual modules
    integration: Integration tests for full pipeline
    performance: Performance and benchmark tests
    slow: Tests that take more than 1 second
    requires_pymol: Tests requiring PyMOL service
    requires_ollama: Tests requiring Ollama service

# Logging configuration
log_cli = false
log_cli_level = INFO
log_file = pytest.log
log_file_level = DEBUG

# Timeout for tests (prevent hanging tests)
timeout = 300

# Test paths
testpaths = .
